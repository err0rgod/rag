services:
  - type: web
    name: rag-document-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_model.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
