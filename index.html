<!DOCTYPE html>
<html>
<head>
    <title>General AI Document Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; height: 100vh; margin: 0; }
        #chat-container { width: 100%; max-width: 800px; background: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #header { background: #0084ff; color: white; padding: 20px; text-align: center; font-weight: bold; position: relative;}
        .header-title { font-size: 22px; margin-bottom: 10px; }
        .upload-section { background: rgba(0,0,0,0.1); padding: 10px; border-radius: 8px; font-size: 14px; display: inline-block;}
        #upload-status { margin-top: 5px; font-size: 13px; font-weight: normal; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 14px 18px; border-radius: 18px; max-width: 80%; line-height: 1.5; font-size: 15px; word-wrap: break-word;}
        .user-message { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background: #e4e6eb; color: black; align-self: flex-start; border-bottom-left-radius: 4px; }
        #input-container { padding: 20px; border-top: 1px solid #ccc; display: flex; gap: 10px; background: white; }
        #user-input { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; }
        #send-btn { padding: 10px 25px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 16px; font-weight: bold;}
        #send-btn:hover { background: #0073e6; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <div class="header-title">General Document AI</div>
            <div class="upload-section">
                <input type="file" id="pdf-upload" accept=".pdf" style="color: white; font-size: 13px;">
                <button onclick="uploadPDF()" style="cursor: pointer; padding: 4px 10px; border-radius: 4px; border: none; font-weight: bold;">Upload PDF</button>
                <div id="upload-status"></div>
            </div>
        </div>
        
        <div id="messages">
            <div class="message bot-message">Hello! I am your AI Document Assistant. You can ask me about the Indian Constitution, OR you can upload your own PDF above and ask me questions about it!</div>
        </div>
        
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let history = [];

        // --- NEW FILE UPLOAD LOGIC ---
        async function uploadPDF() {
            const fileInput = document.getElementById('pdf-upload');
            const statusDiv = document.getElementById('upload-status');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Please select a PDF file first.";
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);
            
            statusDiv.innerText = "Uploading and processing... (This may take a minute)";
            statusDiv.style.color = "#ffeeba"; // Yellow-ish
            
            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                statusDiv.innerText = data.message || "Upload complete!";
                statusDiv.style.color = "#d4edda"; // Green-ish
                addMessage(`I have successfully read and memorized "${file.name}". You can now ask me questions about it!`, "bot-message");
                
            } catch (err) {
                statusDiv.innerText = "Upload failed.";
                statusDiv.style.color = "#f8d7da"; // Red-ish
            }
        }
        // -----------------------------

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-message');
            input.value = '';
            
            const messagesDiv = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.innerText = 'Thinking...';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, history: history })
                });
                const data = await res.json();
                
                messagesDiv.removeChild(typingDiv);
                addMessage(data.response, 'bot-message');
                
                history.push({"role": "user", "content": text});
                history.push({"role": "assistant", "content": data.response});
                
            } catch (err) {
                messagesDiv.removeChild(typingDiv);
                addMessage("Error connecting to server.", 'bot-message');
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
